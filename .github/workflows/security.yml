name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  # ── Secret scanning over the full history ──────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Static analysis (CodeQL) ───────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ── Flag risky dependency changes on PRs ───────────────────────────
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Dependency audit & license report (informational) ──────────────
  # Ported from the backend repo's ci.yaml, which ran these on every PR. They are
  # advisory only — every step is continue-on-error and this job is deliberately
  # NOT part of ci.yml's ci-ok gate, matching the source repo's behaviour.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm's native audit replaces the source repo's better-npm-audit, which
      # reads `npm audit --json` and needs a package-lock.json this repo has not
      # got.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Check licenses
        run: npx --yes license-checker --production
        continue-on-error: true
      - name: Generate license report
        run: |
          npx --yes license-report --output=table \
            --fields="name" \
            --fields="licenseType" \
            --fields="installedVersion" \
            --fields="link"
        continue-on-error: true
