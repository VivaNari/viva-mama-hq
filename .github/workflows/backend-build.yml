name: Backend — Build Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (example: v1.0.0 or latest)'
        required: true
        default: latest

concurrency:
  group: backend-build-${{ github.ref }}
  # Queue rather than cancel: a half-pushed tag is worse than a slow queue.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Non-secret constants shared by every GCP workflow here. Set the matching repo
  # Variable to override without editing workflows; the literal is today's value.
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  GAR_REPO: ${{ vars.GAR_REPO || 'vivamama-repo' }}
  IMAGE_NAME: vivamama-backend

jobs:
  build-and-push:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.UAT_GCP_SA_KEY }}
          project_id: ${{ secrets.SHARED_ARTIFACT_PROJECT_ID }}
          configure_docker_region: ${{ env.GCP_REGION }}

      - name: Resolve image base
        run: |
          echo "IMAGE_BASE=${GCP_REGION}-docker.pkg.dev/${{ secrets.SHARED_ARTIFACT_PROJECT_ID }}/${GAR_REPO}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      # The build context is the REPO ROOT, not services/backend. The Dockerfile
      # installs the whole pnpm workspace so @vivamama/contracts resolves, which
      # it cannot do from inside the service directory. (The source repo's
      # --build-arg NODE_ENV=production is dropped: this Dockerfile declares no
      # matching ARG, so it was a silent no-op.)
      - name: Build image
        run: docker build -f services/backend/Dockerfile -t "${IMAGE_BASE}:${{ inputs.image_tag }}" .

      - name: Push image
        run: |
          docker push "${IMAGE_BASE}:${{ inputs.image_tag }}"
          docker tag "${IMAGE_BASE}:${{ inputs.image_tag }}" "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:latest"
