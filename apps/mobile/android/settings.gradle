// pnpm hoists dependencies to the workspace root (node-linker=hoisted, see
// ../.npmrc), so from android/ the real node_modules is three levels up, not
// one. Same root-vs-app split as ../metro.config.js.
pluginManagement {
  includeBuild("../../../node_modules/@react-native/gradle-plugin")

  // Expo modules (expo-speech, expo-speech-recognition). Resolved through node rather
  // than a fixed path for the same hoisting reason as above.
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}
// Expo's autolinking reports the community (react-native) libraries too, so everything
// still autolinks as before, plus the Expo modules.
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand) }
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
rootProject.name = 'viva_nari_app'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')

// Manual linking for react-native-splash-screen
include ':react-native-splash-screen'
project(':react-native-splash-screen').projectDir = new File(rootProject.projectDir, '../../../node_modules/react-native-splash-screen/android')
