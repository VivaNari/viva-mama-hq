name: vivamama

# Full local stack: MongoDB + Redis + backend API + RAG chatbot.
#   1) cp services/backend/.env.example services/backend/.env   (fill in values)
#   2) cp services/chatbot/.env.example  services/chatbot/.env   (set GROQ_API_KEY)
#   3) docker compose up --build
# The mobile app runs separately via Metro (see apps/mobile/README.md).

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Root context so the @vivamama/contracts workspace dependency resolves.
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: services/backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGO_URI: mongodb://mongo:27017/viva_mama
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Ship logs (and spans) to the local collector. In GCP the collector is its own
      # Cloud Run service and OTEL_AUTH_MODE is "oidc"; locally there is no auth.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_AUTH_MODE: none
      OTEL_TRACES_ENABLED: 'true'
      DEPLOYMENT_ENV: local
      # To enable Firebase push, mount a service-account key (see volumes below)
      # and uncomment:
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # volumes:
    #   - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  otel-collector:
    # Local stand-in for the collector that runs as its own Cloud Run service in GCP.
    # Receives OTLP over HTTP on 4318 and prints what it gets, which is enough to confirm
    # the backend is emitting records with the attributes you expect. Swap the `debug`
    # exporter in the config for a real backend when you want to keep the data.
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # 4318 = OTLP/HTTP. The backend exporters are the HTTP flavour, not gRPC.
      - '${OTEL_COLLECTOR_PORT:-4318}:4318'

  chatbot:
    # NOTE: the image bakes the ~2.3 GB BAAI/bge-m3 embedding model into a
    # cache-stable layer so it is never fetched at request time. The first build
    # is correspondingly slow; subsequent ones reuse the layer. Set MODEL_GCS_URI
    # to load the model from a bucket at start-up instead.
    build:
      context: services/chatbot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: services/chatbot/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongo:27017
      LOCAL_VECTOR_DIR: /app/.local_vector_store
    ports:
      - '${CHATBOT_PORT:-8001}:8001'
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      # Bring your own corpus (see services/chatbot/data/SOURCES.md) and persist the index.
      - ./services/chatbot/data:/app/data
      - chatbot_vector_store:/app/.local_vector_store

volumes:
  mongo_data:
  redis_data:
  chatbot_vector_store:
